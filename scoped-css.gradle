// Extracts CSS declared with `mono.scopedcss.css("""...""")` in Kotlin sources into a generated
// `scoped.css`, which is imported at the end of `main.css`.
// See libs/scoped-css/src/main/kotlin/mono/scopedcss/ScopedCss.kt

import java.util.regex.Pattern

def scopedCssOutputDir = layout.buildDirectory.dir('generated/scoped-css').get().asFile

// Kotlin source roots of the root project, the app and every lib.
def scopedCssSourceRoots = [file('src/main/kotlin'), file('app/src/main/kotlin')] +
    rootProject.subprojects
        .findAll { it.projectDir.parentFile.name == 'libs' }
        .collectMany { [file("${it.projectDir}/src/main/kotlin"), file("${it.projectDir}/src/jsMain/kotlin")] }
        .findAll { it.exists() }

task extractScopedCss {
    description = 'Extract colocated scoped CSS from Kotlin sources'
    group = 'build'

    def sources = files(scopedCssSourceRoots.collect { fileTree(it) { include '**/*.kt' } })
    def rootDir = rootProject.projectDir
    def outputFile = new File(scopedCssOutputDir, 'scoped.css')

    inputs.files(sources).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.file(outputFile)

    doLast {
        // FNV-1a 32-bit hash over UTF-16 code units, encoded in base 36.
        // Must stay in sync with `scopedClassName` in ScopedCss.kt.
        def scopedClassName = { String source ->
            int hash = (int) 0x811c9dc5L
            for (int i = 0; i < source.length(); i++) {
                hash = (hash ^ (int) source.charAt(i)) * 0x01000193
            }
            's-' + Integer.toUnsignedString(hash, 36)
        }

        def callPattern = Pattern.compile(/\bcss\(/)
        def literalPattern = Pattern.compile(/css\(\s*"""(.*?)"""\s*\)/, Pattern.DOTALL)
        def templatePattern = Pattern.compile(/\$[A-Za-z_{]/)

        // class name -> [source, location], in source order: by file path, then by position in the file
        def blocks = new LinkedHashMap<String, Map>()
        def errors = []

        sources.files.sort { it.path }.each { File file ->
            def text = file.getText('UTF-8')
            if (!text.contains('import mono.scopedcss.css')) {
                return
            }
            def relativePath = rootDir.toPath().relativize(file.toPath()).toString()
            def calls = callPattern.matcher(text)
            while (calls.find()) {
                def line = text.substring(0, calls.start()).count('\n') + 1
                def location = "$relativePath:$line"
                def literal = literalPattern.matcher(text).region(calls.start(), text.length())
                if (!literal.lookingAt()) {
                    errors << "$location: css() must be called with a raw string literal (\"\"\"...\"\"\")."
                    continue
                }
                def body = literal.group(1)
                if (templatePattern.matcher(body).find()) {
                    errors << "$location: string templates are not allowed in css()." +
                        ' Use CSS custom properties (var(--name)) for shared values.'
                    continue
                }
                def className = scopedClassName(body)
                def existing = blocks[className]
                if (existing != null && existing.source != body) {
                    errors << "$location: scoped class name $className collides with ${existing.location}."
                    continue
                }
                if (existing == null) {
                    blocks[className] = [source: body, location: location]
                }
            }
        }

        if (!errors.isEmpty()) {
            throw new GradleException("Invalid scoped CSS:\n" + errors.join('\n'))
        }

        outputFile.parentFile.mkdirs()
        outputFile.setText(
            "/* Generated by the extractScopedCss task. Do not edit. */\n" +
                blocks.collect { className, block ->
                    "\n/* ${block.location} */\n.$className {${block.source}}\n"
                }.join(''),
            'UTF-8'
        )
    }
}
